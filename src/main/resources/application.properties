spring.application.name=dhananjay

# ---------------------------------------------------------------
# MySQL (override with environment variables, no code change needed)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ikaansh?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=5}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567899}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------
# JPA / Hibernate - schema is owned by Flyway, Hibernate never touches DDL
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------
jwt.secret=${JWT_SECRET:e3f2a1b4c5d6e7f89123456789abcdef0123456789abcdef0123456789abcdef}
jwt.expiration-ms=28800000

# ---------------------------------------------------------------
# Application rules
# ---------------------------------------------------------------
# Set to false in production so nobody can self-register as ADMIN
app.security.allow-admin-signup=${ALLOW_ADMIN_SIGNUP:true}
# Same user + same title + same due date within this window = double click (409)
# Row-lock wait is capped at 5s via the JDBC url (innodb_lock_wait_timeout) -> 409 instead of hanging
app.task.duplicate-window-seconds=5

# ---------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
